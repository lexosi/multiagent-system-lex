# Ruff config — lint the wrappers, tests, and metrics.
# Default rule set (pyflakes F + pycodestyle E4/E7/E9) keeps signal high without
# style noise (no line-length gate on an existing codebase).
target-version = "py311"

# Archived probe/experiment scripts are not part of the maintained surface.
extend-exclude = ["scripts/metrics/archive"]

[lint]
# Pin the rule set explicitly so CI is deterministic across ruff releases.
# Ruff's default selection widened in 0.16 (I001, BLE001, UP017, RUF100, ...),
# which is exactly the style noise this project opts out of. Keep it to
# pyflakes (F) + pycodestyle logical/syntax (E4/E7/E9).
select = ["E4", "E7", "E9", "F"]
